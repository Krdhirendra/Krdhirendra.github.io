<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhirendra Kumar · Product and AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0b0b0f;--card:#f5f5f8;--line:#e6e6ec;--muted:#62626e;--y:#FFEE00;--ink:#08080c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e12;--fg:#f4f4f6;--card:#17171d;--line:#2a2a33;--muted:#a3a3ae}}
:root[data-theme="dark"]{--bg:#0e0e12;--fg:#f4f4f6;--card:#17171d;--line:#2a2a33;--muted:#a3a3ae}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 "Poppins",system-ui,sans-serif}
h1,h2,h3,.bb{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;margin:0;line-height:.95;letter-spacing:.01em}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.wrap{--pad:clamp(8px,1vw,18px);max-width:none;margin:0 auto;padding:var(--pad)}
/* hero card */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:0;border:0;margin:calc(-1*var(--pad)) calc(-1*var(--pad)) 0;padding:26px clamp(24px,4vw,64px) 40px;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
background:radial-gradient(800px 500px at 88% 18%,rgba(38,70,255,.55),transparent 62%),radial-gradient(500px 380px at 70% 100%,rgba(38,70,255,.25),transparent 70%),var(--ink)}
.hero::before{content:"";position:absolute;inset:0 0 0 48%;background:repeating-linear-gradient(90deg,rgba(60,90,255,.14) 0 46px,transparent 46px 110px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.mono-unused{position:absolute;right:4%;top:14%;font:400 clamp(14rem,30vw,30rem)/.8 "Bebas Neue",sans-serif;color:transparent;-webkit-text-stroke:2px rgba(255,238,0,.55);pointer-events:none;user-select:none}
.nav{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{font:400 1.6rem/1 "Bebas Neue",sans-serif;text-decoration:none;letter-spacing:.04em}
.pillnav{display:flex;gap:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:6px}
.pillnav a{text-decoration:none;font-size:.85rem;padding:7px 16px;border-radius:99px}
.pillnav a:hover{background:rgba(255,255,255,.14)}
.navr{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:10px 20px;font-size:.88rem;font-weight:500;text-decoration:none;border:1px solid rgba(255,255,255,.5);color:#fff;white-space:nowrap}
.pill.y{background:var(--y);border-color:var(--y);color:#111}
.pill.y:hover{background:#fff}
.circ{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--y);color:#111;text-decoration:none;font-weight:600}
.hcontent{position:relative;max-width:min(1400px,92%);padding-top:8vh;margin:auto 0}
.script{font:400 clamp(3.6rem,8.6vw,7.4rem)/1 "Yellowtail",cursive;color:var(--y);transform:rotate(-3deg);transform-origin:left;margin-bottom:10px;display:block}
.hero h1{font-size:2.5rem;color:#fff}
.hrow{display:flex;align-items:center;gap:18px;margin-top:28px;flex-wrap:wrap}
.hrow small{font-size:.8rem;color:#c9c9d6;line-height:1.4}
.glass{position:relative;margin-top:0;align-self:flex-start;display:flex;align-items:center;gap:26px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:16px 24px;backdrop-filter:blur(8px);flex-wrap:wrap}
.glass strong{font-weight:500;font-size:.95rem;max-width:190px;line-height:1.3}
.glass div.n{text-align:center;padding-left:22px;border-left:1px solid rgba(255,255,255,.25)}
.glass .n b{display:block;font:400 2rem/1 "Bebas Neue",sans-serif}
.glass .n span{font-size:.72rem;color:#c9c9d6}
.who{position:absolute;right:36px;bottom:36px;background:#fff;color:#111;border-radius:16px;padding:10px 18px 10px 10px;display:flex;gap:12px;align-items:center}
.who i{width:44px;height:44px;border-radius:10px;background:var(--y);display:grid;place-items:center;font:400 1.4rem/1 "Bebas Neue",sans-serif;font-style:normal}
.who b{display:block;font-size:.9rem;font-weight:600;line-height:1.2}.who span{font-size:.72rem;color:#666}
/* sections */
section{padding:84px 8px 0}
.shead{text-align:center;max-width:620px;margin:0 auto 26px}
.shead h2{font-size:clamp(2.6rem,6vw,4.4rem)}
.shead p{color:var(--muted);margin:10px 0 0;font-size:.95rem}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.filters button{font:500 .8rem "Poppins",sans-serif;border:0;border-radius:99px;padding:8px 18px;background:var(--card);color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{display:flex;flex-direction:column;min-height:420px;border-radius:22px;padding:22px;color:#fff;text-decoration:none;background:linear-gradient(160deg,var(--c1),var(--c2));transition:transform .25s}
.card:hover{transform:translateY(-6px)}
.card .cat{align-self:flex-start;font-size:.72rem;background:rgba(255,255,255,.18);border-radius:99px;padding:3px 12px}
.card h3{font-size:2.5rem;margin:auto 0 8px}
.card p{margin:0 0 16px;font-size:.84rem;line-height:1.5;color:rgba(255,255,255,.88)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.25);padding-top:12px;margin-bottom:16px}
.mini b{display:block;font:400 1.35rem/1.05 "Bebas Neue",sans-serif;color:var(--y)}.mini span{font-size:.62rem;line-height:1.25;display:block;color:rgba(255,255,255,.8)}
.card .go{background:var(--y);color:#111;text-align:center;border-radius:99px;padding:10px;font-size:.82rem;font-weight:600}
.grid.two{grid-template-columns:repeat(2,1fr)}.xc{min-height:340px}
.card .cover{width:62%;max-width:210px;aspect-ratio:1;border-radius:18px;align-self:center;margin:14px 0 4px;object-fit:cover}
.card .cover.wide{width:100%;max-width:300px;aspect-ratio:640/420;object-fit:contain;border-radius:0}
.card .cover.plate,.dlogo.plate{background:#fff;padding:10px 14px;border-radius:16px}
.card .cover.plate{aspect-ratio:704/171;max-width:300px;width:100%}
.dlogo.plate{width:260px;aspect-ratio:704/171;object-fit:contain}
.card .cover.flat{width:100%;max-width:300px;aspect-ratio:auto;object-fit:contain;border-radius:0;background:none;padding:0}
.dlogo.flat{width:260px;border-radius:0}
.ink{color:#1a0508!important}.ink p,.ink .sub{color:rgba(26,5,8,.82)!important}
.ink .cat,.ink .meta span{background:rgba(26,5,8,.1)!important}
.ink .mini{border-top-color:rgba(26,5,8,.25)}.ink .mini b,.ink .stats3 b{color:#1a0508}.ink .mini span,.ink .stats3 span{color:rgba(26,5,8,.82)}
.ink .stats3 div{background:rgba(26,5,8,.08)}
.dlogo.wide{width:240px;border-radius:0}
.dlogo{position:absolute;right:36px;top:110px;width:170px;border-radius:20px}
.about{max-width:760px;margin:0 auto;text-align:center}
.plate{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 18%;border-radius:24px;display:block;background:var(--y)}
.photo{position:absolute;right:4%;bottom:0;width:min(40%,470px);aspect-ratio:1117/1408;object-fit:cover;border-radius:24px 24px 0 0;box-shadow:0 0 80px rgba(38,70,255,.45);-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.about h2{font-size:clamp(2.6rem,5vw,4rem);margin-bottom:14px}
.about p{color:var(--muted);margin:0 auto;font-size:1.05rem}
.about ul{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
.about li{background:var(--card);border-radius:14px;padding:12px 16px;font-size:.92rem}
.about li b{display:block;font-weight:600}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:900px;margin:0 auto}
.tags span{background:var(--card);border-radius:99px;padding:7px 16px;font-size:.85rem}
.skillrows{display:grid;gap:22px;max-width:900px;margin:0 auto}
.skillrows h3{font-size:1.5rem;text-align:center;margin-bottom:10px}
.cta{margin-top:84px;background:var(--ink);color:#fff;border-radius:28px;border:1px solid #1d1d28;padding:56px 40px;text-align:center;background-image:radial-gradient(600px 300px at 50% 120%,rgba(38,70,255,.45),transparent 70%)}
.cta h2{font-size:clamp(2.6rem,6vw,4.6rem);max-width:14ch;margin:0 auto 12px}
.cta p{color:#c9c9d6;max-width:46ch;margin:0 auto 24px;font-size:.95rem}
.cta .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{padding:28px 8px 40px;color:var(--muted);font-size:.85rem;text-align:center}
/* detail */
.dh{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:22px 36px 40px;background:linear-gradient(160deg,var(--c1),var(--c2))}
.dh .nav{margin-bottom:56px}
.dh .back{margin-bottom:18px}
.dh h1{font-size:clamp(3.4rem,9vw,7.2rem);max-width:12ch}
.dh .sub{max-width:62ch;margin:14px 0 18px;color:rgba(255,255,255,.9);font-size:1.02rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.meta span{background:rgba(255,255,255,.16);border-radius:99px;padding:5px 14px;font-size:.78rem}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px}
.stats3 div{background:rgba(0,0,0,.28);border-radius:16px;padding:14px 18px}
.stats3 b{display:block;font:400 2.5rem/1 "Bebas Neue",sans-serif;color:var(--y)}.stats3 span{font-size:.76rem;line-height:1.35;display:block;color:rgba(255,255,255,.88)}
.body{max-width:940px;margin:36px auto 0;display:grid;gap:16px;padding:0 8px}
.blk{background:var(--card);border-radius:22px;padding:28px 30px}
.blk h2{font-size:2.3rem;margin-bottom:10px}
.blk p{margin:0 0 12px;color:var(--muted);max-width:72ch}
.blk ul{margin:0;padding-left:20px;max-width:74ch}
.blk li{margin-bottom:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0 4px}
.kv div{background:var(--bg);border-radius:14px;padding:12px 16px;border:1px solid var(--line)}
.kv b{display:block;font:400 1.9rem/1.05 "Bebas Neue",sans-serif}.kv span{font-size:.8rem;color:var(--muted);line-height:1.35;display:block}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;text-decoration:none;color:#fff;border-radius:22px;padding:26px 30px;background:linear-gradient(160deg,var(--c1),var(--c2))}
.next h3{font-size:2.4rem}.next small{opacity:.85}
@media(max-width:900px){
.hero{padding:18px 20px 24px;min-height:100vh;min-height:100svh}.hero{display:flex;flex-direction:column}.glass{order:4}.photo{order:5}.pillnav{display:none}.hcontent{padding-top:40px;max-width:none;margin-bottom:0}.photo{position:relative;right:auto;bottom:auto;width:100%;max-width:380px;margin:26px auto -24px;display:block;border-radius:24px}
.glass,.who{position:relative;left:auto;right:auto;bottom:auto;margin-top:22px}.glass{gap:14px}.glass div.n{padding-left:14px}
.grid,.grid.two{grid-template-columns:1fr}.card{min-height:380px}
.dh{padding:18px 20px 28px}.dlogo{display:none}.stats3{grid-template-columns:1fr}.blk{padding:22px 20px}.cta{padding:40px 20px}}
@media(min-width:1280px){.grid:not(.two){grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){html,body{overflow-x:hidden}.hero>*{min-width:0;max-width:100%}.hcontent{width:100%}.hero h1{font-size:min(2.5rem,9vw);overflow-wrap:break-word}.navr .pill:not(.y){display:none}.navr .pill{padding:9px 16px}.glass{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 0;width:100%}.glass strong{grid-column:1/-1;max-width:none}.glass div.n{padding:0 6px}.glass div.n:nth-of-type(1){border-left:0;padding-left:0}.glass .n b{font-size:1.8rem}.glass .n span{font-size:.7rem;display:block;line-height:1.25}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head>

 {h:"The problem",p:"MagentaCard sits inside a 12.2M-user telecom app, yet only an estimated 30–60K people use the card each month. End-to-end funnel conversion is 0.03%, against 0.5–1.5% for comparable fintechs. Four blockers explain it.",
  items:["Onboarding takes 10–15 minutes and needs a mandatory video KYC call.","Rewards come as “Coins” with no clear € value or redemption path.","Switching from MeinMagenta to the payzy app loses 25–40% of people at each redirect.","A Greek e-money licence gives German consumers no trust signal."]},
 {h:"Market and competition",p:"Germany is a mature card market: 8.3B Girocard transactions in 2025, 97% of residents own a debit card and over 80% of point-of-sale payments are contactless. I benchmarked MagentaCard against Revolut, N26, Trade Republic and Vivid on fees, KYC, reach and retention.",
  kv:[["12.2M","captive MeinMagenta users at about €0 acquisition cost"],["€15–50","what competitors pay to acquire one user"],["10–15 min","MagentaCard onboarding vs about 5 min at Revolut"],["Greek EMI","licence vs bank licences at rivals: a trust gap"]]},
 {h:"Who it’s for",p:"Eight personas, each with pain points, core needs and an effort-versus-impact rating.",items:["Telekom customers: loyal subscriber (~3–4M users), digital-native young professional (~1.5–2M), family plan manager (~1–1.2M) and SMEs and freelancers (~4M).","Non-customers: cashback hunter (~2–3M), budget-conscious student (~2M), new-to-Germany resident (~1–1.5M a year) and merchant or B2B user."]},
 {h:"The solution",items:["Two-tier onboarding. Tier 1 needs no KYC under €150/month, with details prefilled from MeinMagenta, and takes about 20 seconds. Tier 2 adds a full ID scan for higher limits and up to 2.5% cashback.","A warm hand-off from MeinMagenta to payzy using SSO, deep links and prefilled KYC, to stop app-switch drop-off.","Coins that pay the Telekom bill, so rewards have a clear value (100 Coins = €1).","A Magenta Bytes flywheel that rewards actions, not just spend. 1 GB of data costs Telekom about €0.40 but is worth €3–4 to the customer.","Gamification: Daily Spin and Win, Coin Rush events, partner deals and habit loops.","Four card tiers priced below N26 and Revolut: Basic €0, Super €4.49, Metal €9.99 and Business €7.99."]},
 {h:"Feature prioritisation",p:"Ten features, each scored out of 10 on Impact and Reach. The overall score averages the two.",kv:[["9.5","Telecom-powered acquisition"],["9.0","Coins rewards and gamification"],["8.5","Fast KYC and Lite tier"],["8.5","Virtual card with wallet auto-provisioning"],["8.5","Telecom bill redemption"],["6.5","Instant card controls (lowest)"]]},
 {h:"Go-to-market",items:["Month 0–1, validate: controlled rollout through MeinMagenta. Targets: KYC completion above 65%, first transaction rate above 40%, time to first transaction under 24 hours.","Month 2–4, Telekom users: pay your bills smarter, 5% cashback on recharge and “invite and earn” referrals. Targets: activation above 50%, near-zero CAC.","Month 5–8, everyone: paid acquisition, consumer-brand partnerships and Apple Pay integration. Targets: non-Telekom users onboarded, CAC within LTV targets.","Month 9–12, ecosystem: B2B wallets, insurance, savings round-ups and habit loops. Success is 30/60/90-day retention, transactions per user and ARPU."]},
 {h:"Projected impact",p:"Targets for month 12 from the summary slide:",kv:[["4.0M → 400K","exposed to active users (1.13M register, 760K transact)"],["€3.50","projected CAC, 93% below competitors"],["45%","projected 90-day retention vs about 18% today"],["€12.6M","retained customer lifetime value"],["1.5pp","telecom churn reduction"],["21%","maximum bill saving with full Coins redemption"]]},
 {h:"Risks and mitigations",p:"Ten risks in four categories, each scored on Likelihood × Impact. Leading indicators are KYC completion, first-transaction conversion, weekly active users and payment intent. Lagging indicators are transaction volume, revenue, 30-day retention and transactions per user.",items:["High × High, trust: the Greek licence. Mitigation: Visa-backed, GDPR/PCI compliant, €150K insured, positioned as a smart wallet, exploring a BaFin route.","High × High, onboarding: KYC drop-off. Mitigation: Lite tier, prefilled KYC, onboarding under 5 minutes.","High × High, onboarding: app-switch abandonment. Mitigation: SSO deep-linking, in-app progress tracker, deferred deep links.","Mid × High: Greek IBAN rejection, low payzy install conversion, interchange below cashback cost, and churn after the cashback honeymoon, each with a mapped mitigation.","Low × Very High: a neobank-telecom partnership and cross-app GDPR/PCI exposure.","Mid × Mid: a stale rewards catalogue, handled with monthly partner refreshes."]}
 ]},
{id:"techinnovate",type:"exp",role:"Product Management Intern",org:"Techinnovate Mobility · Jun – Jul 2026",xd:"Segmented 3 shipper personas, ran a competitor SWOT and proposed 4 features, including FlexiRoute, for a $270B logistics market.",
 c:["#E31B23","#6b0a10"],cat:"Product strategy",title:"Techinnovate Mobility",
 desc:"Product strategy for an EV-first logistics platform: FlexiRoute, trust and bidding.",
 sub:"A product strategy for reimagining logistics with EVs, smart routing and anti-fraud systems, built during my product management internship.",
 meta:["Product Management Intern","Techinnovate Mobility","Jun – Jul 2026"],
 stats:[["60%","modelled cut in return-trip loss in the FlexiRoute example (10k to 4k)"],["$270B","Indian logistics market, 2024"],["4","features proposed"]],
 secs:[
 {h:"Market overview",p:"India’s logistics market was about USD 270B in 2024, with a CAGR of 10–12% over the past decade. Globally it is about USD 13T at 5–7%. Key trends are AI-driven optimisation, real-time tracking, the EV transition and data-driven decisions. Key players are BlackBuck, Vahak and Rivigo. Traditional methods fall short in four places:",
  items:["Load matching is manual, with little visibility on return trips.","Pricing is static and pre-determined.","Trust relies on basic driver verification and reactive cancellation handling.","Fleets are mostly fossil-fuel, with nascent EV adoption."],
  kv:[["40%","of trips run as empty return hauls, inflating costs 15–20%"],["Rigid","pricing that misses dynamic market value"],["Fraud","frequent cancellations and fake bookings erode trust"],["EV gap","limited charging infrastructure and high upfront cost"]]},
 {h:"Competitor analysis",p:"I ran a SWOT on BlackBuck and turned its weaknesses into four areas for improvement.",items:["Strengths: live inventory visibility, automated fulfilment, unified sales channels, AI-powered analytics.","Weaknesses: outdated tech stack, weak customer support, limited capital, narrow revenue model.","Smarter support: AI chatbots with live escalation, trackable tickets and agent feedback.","Stronger premium plans: pro dashboards for fleets, faster payouts and built-in insurance.","Simpler payments: direct UPI or bank transfers, FASTag with instant cashback.","Better fleet tools: OBD-based vehicle alerts, driver logbooks and load filters.","Our advantages: focused efficiency with FlexiRoute, trust from day one, flexible pricing and a lead in the green transition."]},
 {h:"Personas",p:"Three shipper segments, each with its own goals and pain points:",items:["Occasional and small-volume shippers want affordable solutions, simple booking and reliable service. They struggle with high per-shipment costs, finding reliable carriers and a lack of negotiation power.","Regular and mid-volume shippers want consistent transport, efficient booking and management, and competitive pricing. They lose time on repetitive bookings, coordinate with multiple carriers and need tracking.","High-volume and enterprise shippers want capacity for fluctuating demand, integration with their logistics systems and advanced analytics. They struggle with complex operations, a need for data-driven insights and consistent service quality."]},
 {h:"Feature 1: FlexiRoute discount",p:"Trucks often return empty or wait days for a load. FlexiRoute matches flexible shippers to trucks already heading back on a route, such as Mumbai–Delhi, and offers a discount for the return date. In the deck’s worked example, the trip is priced at 40k with an ideal profit of 15k:",
  items:["For fleet owners: convert empty return trips into revenue, cut fuel, toll and driver costs, raise asset utilisation and avoid waiting costs.","For customers: discounted rates for flexible deliveries, reliable capacity and a greener choice through fewer empty miles."],
  kv:[["10k → 4k","loss per trip, 60% lower"],["5k → 11k","profit on the return leg"],["4k","discount offered to the shipper"],["10k","cost of a 10-day wait, removed"]]},
 {h:"Feature 2: trust and booking safety",p:"The aim is to cut last-minute cancellations, fraudulent bookings and opacity, which cost both shippers and carriers money.",items:["Verified driver disclosure: driver details shared 24 hours before the trip.","Dual cancellation penalty: a flat fine (for example 10%) applies to either side for late cancellations, with no fine when there is a genuine reason with proof.","Mandatory advance deposit for customers, equal to the cancellation charge and non-refundable on invalid cancellation.","Driver guarantee token committed at booking, equal to the cancellation charge and adjusted by behaviour.","Dynamic reputation scoring for both parties.","Expected impact: more platform integrity, less financial risk, more accountability and stronger community trust."]},
 {h:"Feature 3: dynamic bidding",p:"Shippers post a bid with their price and dates at least 15 days ahead. The platform finds available verified drivers, who can accept, reject or counter-offer. A bid auto-cancels if no one accepts within 7 days, and shippers are notified with re-bid or fixed-rate options. A booking deposit deters fake inquiries. The expected impact is better price transparency, empowered shippers, more efficient routes and higher truck utilisation."},
 {h:"Feature 4: EV transition",items:["Early-mover strategy on short-haul city pairs such as Mumbai–Pune, with routes chosen by charging availability.","Total cost of ownership savings as the sales argument to customers.","Omni-EV Charging Card: one payment method across partner stations such as Jio-bp and Tata Power.","Anti-Pollution Points earned by booking EV trucks and redeemable for charging discounts and gift items.","Expected impact: universal charging access, lower carbon footprint, long-term cost savings and a pioneer position in sustainable logistics."]}
 ]},
{id:"amrst",c:["#1d3aba","#1d3aba"],img:AMO,cat:"Product strategy",title:"Amorist: Gen Z fragrance",
 desc:"A 3-year growth strategy for a D2C fragrance brand built on romance and layering.",
 sub:"Market sizing, positioning, acquisition, retention and unit economics for Amorist, a D2C perfume brand aimed at Gen Z.",
 meta:["GC Tech 2025-26","Case study competition","March 2026"],
 stats:[["$250M","serviceable obtainable market"],["₹139L","Year 3 revenue, up from ₹26L"],["7.9x","LTV:CAC by Year 3"]],
 secs:[
 {h:"Industry and market size",p:"India’s fragrance market is growing at about 15% a year and only 30% of it is organised. Per-capita fragrance spend is $0.22 against $26 in the US, and India is the third-largest market in Asia-Pacific. Mass and mid-premium fragrances (about $1.5B) grow at 17% and luxury (about $1B) at 9%. I sized the opportunity top down:",
  kv:[["$2.5B","TAM: the Indian perfume industry"],["$1B","SAM: Gen Z is about 40% of purchases"],["$250M","SOM: 25% romance segment"],["13%","CAGR of the obtainable market"]]},
 {h:"Competitors and the whitespace",p:"I mapped six brands (Skinn, Villain, Bella Vita, Wild Stone, Engage, Fogg) on price from ₹200 to ₹2,500, and plotted them on a positioning map of mass vs premium and lifestyle-led vs identity-led. Mass brands that tried to sell an identity lost prestige through discounts, and Villain sells identity but only to men. Four whitespaces emerged: romance positioning, emotional communication, date-occasion products and Gen Z scent identity."},
 {h:"Positioning and portfolio",p:"“Fragrance of Romance” for Gen Z, who adopt trends 3x faster than millennials and 62% of whom prefer brands that offer customisation. Two personas anchor it: Riya (23), who gets bored of one perfume but finds five bottles too expensive, and Arjun (24), who wants a unique scent for dates. The key idea is scent layering as a personal “love potion”.",
  kv:[["100ml + 5ml","base perfume with a layering companion"],["₹1,100","15ml gift bundle of 4 compatible scents"],["₹1,500","100ml perfume + 10ml oil"],["₹560 / ₹1,080","2-pack and 4-pack oil bundles"]]},
 {h:"Customer acquisition",p:"Instead of build, advertise and hope, Amorist runs a lab: build a market, generate participation, then launch a validated product.",items:["₹549 discovery kit with 6 accords, creating paid participation.","3-question emotional quiz that maps feelings to a scent and makes a shareable story card.","Community vote where kit buyers choose which scents launch.","Four-stage funnel: SEO, 100+ micro-influencers and campus and dating-app activations; a ₹299 trial kit; a first purchase with a free 5ml companion and an oil add-on (+₹249); then gift and bundle basket expansion."]},
 {h:"Retention",p:"Fragrance is a low-frequency category: 100ml lasts 6–9 months. Layering is a growing Gen Z habit, with 4.7bn+ views on #PerfumeTok and 29% of Gen Z already layering. Two mechanics use it.",items:["Layering: a 5ml vial finishes first and triggers an early repurchase of the 100ml.","Base oils: 10ml oils finish 2–3x faster than perfume and cross-sell across seasons, with predictable replenishment reminders."]},
 {h:"Go-to-market and risks",items:["Year 1 (see what works, find your people, hook them deeper): about ₹26L revenue and the first 500 customers, CAC down from ₹520 to ₹455, LTV:CAC of 5.7x and a spike in oil demand.","Year 2 (go loud): partnerships with dating apps and college events, about ₹61L revenue and 2,000+ active customers.","Year 3 (towards sustainability): about ₹139L revenue and a 35.5% CM1 margin, with corporate partnerships, seasonal drops and e-commerce. LTV:CAC reaches 7.9x, and EBITDA turns positive in the long-term phase after 36 months.","Six risks placed on a Likelihood × Impact matrix with a mitigation for each time window, for example releasing creator pairing tutorials before the oil SKU goes wide."]},
 {h:"Financials",p:"Revenue grows from ₹26.1L to ₹60.9L to ₹138.9L over three years. EBITDA stays negative through Year 3 (−₹23.0L, −₹36.2L and −₹21.7L) and turns positive in the long-term phase. Fragrance oils are the highest-margin channel.",
  kv:[["31%","CM2 for oils vs 12% for hero bottles and 10% for bundles"],["₹15L","gross profit from oils by Year 3 at zero incremental CAC"],["₹24L","EBITDA uplift from layering plus oils over three years"],["9+ → ~6 mo","CAC payback"]],
  items:["Hero bottles: priced at ₹1,299 with about 40% COGS and a ₹520 CAC in Year 1 (1.8% conversion, 18% organic traffic, about ₹90 CPM).","Bundles: ₹145 CAC in Year 1 from about 5% conversion (gifting intent).","Oils: ₹42 CAC from about 13% conversion of hero buyers, with about 3.2 reorders a year.","Layering adds ₹7.7L of value: ₹6.5L gross profit plus ₹3.8L CAC savings, less ₹2.6L sample COGS."]}
 ]},
{id:"frammer",c:["#FF4755","#FF4755"],img:FRM,wide:1,plate:1,cat:"AI and data",title:"Frammer AI analytics",
 desc:"Gold-medal analytics platform and agent work that exposed heavy content waste.",
 sub:"An end-to-end analytics intelligence dashboard for Frammer AI’s clip engine, built by our AI Agents team.",
 meta:["GC Data Analytics Competition","Gold medalist, AI Agents team","April 2026"],
 stats:[["97.5%","waste ratio: most generated clips are never published"],["10x","conversion gap, English vs Hindi"],["Gold","AI Agents team"]],
 secs:[
 {h:"The brief",p:"Frammer AI’s engine turns raw video uploads into short clips. We analysed upload, creation and publishing data to find where value leaks, then built a dashboard with a conversational Copilot on top. Six strategic pillars guided the work: data integrity, AI integration, visual clarity, content ROI focus, platform diversification (less YouTube dependence) and waste reduction."},
 {h:"What the data showed",items:["Over-generation: in the funnel we analysed, 4,453 uploads produced 14,914 created clips and only 111 were published. Only 0.54% of uploaded footage duration is used (807 hours uploaded vs 4 hours published).","Duration: for QA users, published clips cluster at 60–100 seconds while the system generates 2–3x that. Users trim 82% on average (400s generated vs 75s published). Target durations are 70–86s for Shorts and Reels and 248s for YouTube.","Input type: discussion shows convert best at 3.8%, then news at 1.2% and speech at 0.5%. Sports, dramas and podcasts publish nothing.","Output type: Key Moments is the best format (2.59% yield) and Summary the worst (0.12%).","Language: English converts at 3.44% (91 posts) against Hindi at 0.33% (20 posts). Mixed, Spanish, Arabic and Marathi have zero published output, and Hindi clips are generated too long and consistently rejected.","Platform: publishing leans on YouTube (about 32%) and Reels (about 30%). LinkedIn and X, the major B2B channels, have zero published output. Of the 111 published clips, 67 are short-form and 44 long-form.","Channels: Channel A converts above 1.5% against a 0.6% average and drives most long-form YouTube engagement. Twelve channels (D, F and I–R) have zero selection success despite high resource use, and Channel D is a critical failure point.","Trend: uploads surged about 150% in January 2026, then conversion fell to its low of 0.5% in February, a processing bottleneck."]},
 {h:"What we recommended",kv:[["Scale","Discussion shows and My Key Moments"],["Stop","Sports, dramas and in-briefs, pure resource sinks"],["Cap","created duration near 100 seconds, with format-specific targets"],["Fix","Hindi default durations first, keep English as the anchor"]]},
 {h:"15 custom KPIs",p:"We designed non-overlapping KPIs, each with a definition and an example insight: publish conversion rate, month-by-month use rate, processing efficiency, creation rate, upload failure rate, top n% vulnerability, resource and selection, Duration Fit Score, interaction lift, cross-dimension entropy, publish dependency index, point-biserial correlation, multidimensional waste interaction, channel talent alignment and a Relative Efficiency Index per user."},
 {h:"Data quality monitoring",p:"Automated checks cover null violations, duplicate primary keys, negative values, foreign-key violations, invalid dates and contaminated values. They surface in a broken-reference-chain graph, a value contamination matrix and a 90-day quality score trend against a 90% target."},
 {h:"The dashboard",p:"Seven tabs: Mission Control, Trends, Funnel, Metrics, Explorer, Copilot and Data Quality.",items:["Mission-level visibility: headline KPIs, volume summaries and automated AI alerts.","Deep diagnostics: time-series trends with forecasting, anomalies and decomposition.","Multi-angle exploration: custom X/Y axes, dual breakdowns and raw tables.","Pipeline and quality intelligence: conversion funnels, efficiency scoring and data-quality checks."]},
 {h:"Architecture",items:["Three tiers: React frontend, FastAPI backend, PostgreSQL, with independent FastAPI routers registered through a central aggregator.","KPI engine that parses, validates, compiles and executes. The LLM is used only when a KPI is created, to convert natural language to a DSL, so repeat queries run as deterministic SQL with no LLM cost or latency.","Multi-tenant isolation enforced at the query layer through auth middleware: the JWT carries role, client name and user ID, and every endpoint gets scoped WHERE/JOIN predicates. Adding a client needs only database records.","Parameterised query builders and CTE templates eliminate SQL injection risk. The connection pool allows 10 base plus 5 overflow connections, with validation to prevent stale ones, and the frontend uses 10-minute caching."]},
 {h:"The agent work",p:"I co-built a zero-framework ReAct (Reason + Act) orchestrator with fault-tolerant error handling: exponential backoff, automatic retries on API rate limits and real-time self-correction through feedback loops. During the competition we also found and fixed data anomalies across concurrent PostgreSQL queries and condensed multi-source outputs into summaries the team could act on."},
 {h:"Roadmap",p:"Four phases: data foundation and metric design, an agentic conversational layer (95% accuracy target) with vector search and multi-turn logic, an advanced analytics dashboard, and detailed analysis with trend, anomaly and gap reports. The next layer constrains the model’s outputs, retrains a v2 with a focus on Indic-language content, and moves to MLOps with automated retraining.",kv:[["Multi-language","native support via transcription"],["Cross-platform","Shorts, Reels and TikTok optimised"],["Auto-learning","continuous feedback loops"],["Top risks","clip relevance (high), data quality (medium)"]]}
 ]},
{id:"aara",c:["#0f9d6a","#053a28"],cat:"AI and data",title:"AARA research agent",
 desc:"A multi-agent research product from query to cited answer.",
 sub:"Advanced Autonomous Research Agent: I defined the user flow and built the product end to end.",
 meta:["Personal project","Python, LangGraph, LangChain, FastAPI","May 2026"],
 stats:[["2","layers: Gatekeeper then Synthesis"],["Live","telemetry dashboard on Vercel"],["pgvector","hybrid retrieval on AWS RDS"]],
 secs:[
 {h:"What it does",p:"AARA takes a research question and returns a cited answer. It is built as a multi-agent system with LangGraph and served through FastAPI, with a hybrid retrieval pipeline on pgvector hosted on AWS RDS."},
 {h:"A product decision: the Gatekeeper",p:"Every query first passes a Gatekeeper → Synthesis intent-classification layer that decides whether it needs retrieval or is just conversation. Conversational queries skip vector search entirely. It was a deliberate cost-versus-quality trade-off: less compute spent where retrieval adds nothing."},
 {h:"Telemetry as a feature",p:"A live dashboard on Vercel streams agent activity, reasoning traces, latency and errors in real time using NDJSON and server-sent events. It is how I monitor system health and catch failures before they reach users."},
 {h:"Stack",p:"Python, LangGraph, LangChain, FastAPI, pgvector, AWS RDS, NDJSON/SSE streaming, Vercel."}
 ]},
